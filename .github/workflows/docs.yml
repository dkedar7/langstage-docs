name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  build:
    name: Strict build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/snippets.py lint
      - run: mkdocs build --strict

  deploy:
    needs: build   # never publish a site that fails `mkdocs build --strict`
    runs-on: ubuntu-latest
    permissions:
      contents: write  # mkdocs gh-deploy pushes the built site to the gh-pages branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdocs gh-deploy --strict --force --no-history
