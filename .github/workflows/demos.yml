name: Demos

# Records the animated demos in docs/assets/demos/ from the LATEST PyPI releases,
# keyless, on ubuntu-latest:
#   - terminal demos with VHS (demos/tapes/*.tape)
#   - the web app and JupyterLab with Playwright video (demos/scripts/record_*.py)
#   - the VS Code panel with langstage-vscode's own recorder (`npm run record`), from
#     its latest `extension-v*` release tag, against the sidecar from PyPI
# See demos/README.md.
#
# Triggers:
#   - workflow_dispatch: re-record now; on main, open a refresh PR (on another branch,
#     only upload the artifact). `targets` records a subset, e.g. "vscode".
#   - repository_dispatch (type langstage-release): a package release asks for a refresh.
#   - workflow_run after the nightly drift detector (drift.yml): re-record only if a
#     LangStage release moved since the versions in docs/assets/demos/versions.json.
#   - pull_request touching the demo sources: record and upload as an artifact only,
#     so a change to a tape or recorder is checked before it merges.
# A refresh never commits to main. It opens (or updates) a PR from `demos/refresh`.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Demos to record (space-separated; empty = all): cli agui hermes web jupyter vscode"
        required: false
        default: ""
  repository_dispatch:
    types: [langstage-release]
  workflow_run:
    workflows: ["Nightly snippets + PyPI drift"]
    types: [completed]
  pull_request:
    paths:
      - "demos/**"
      - ".github/workflows/demos.yml"

permissions:
  contents: read

concurrency:
  group: demos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.versions.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: versions
        run: python demos/scripts/versions.py check

  record:
    needs: check
    if: github.event_name != 'workflow_run' || needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the latest LangStage releases
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r demos/requirements.txt
          pip list | grep -i -E '^(langstage|playwright)'
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Install VHS (with ttyd and ffmpeg)
        uses: charmbracelet/vhs-action@v2
      # The vscode demo builds and records the extension's webview with Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record the demos
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
          TARGETS: ${{ inputs.targets }}
        # TARGETS is unquoted on purpose: "web vscode" is two targets, empty is all.
        run: bash demos/build.sh $TARGETS
      - name: Check sizes
        run: |
          for f in docs/assets/demos/*.gif; do
            size=$(stat -c %s "$f")
            echo "$f: $((size / 1024)) KiB"
            if [ "$size" -gt 3145728 ]; then echo "::warning file=$f::GIF is over 3 MiB"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demos
          path: docs/assets/demos/
          retention-days: 14

  refresh-pr:
    needs: record
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: demos
          path: docs/assets/demos/
      # Opening the PR needs "Allow GitHub Actions to create and approve pull requests"
      # (Settings > Actions > General), or a DEMOS_PR_TOKEN secret with repo scope.
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DEMOS_PR_TOKEN || github.token }}
          branch: demos/refresh
          delete-branch: true
          add-paths: docs/assets/demos/**
          commit-message: "demos: re-record against the latest LangStage releases"
          title: "demos: re-record against the latest LangStage releases"
          body: |
            Re-recorded by the **Demos** workflow ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}), trigger: `${{ github.event_name }}`).

            `docs/assets/demos/versions.json` lists the exact releases these were recorded against. Review the GIFs in the Files tab before merging.
